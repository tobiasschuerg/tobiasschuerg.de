baseURL = 'https://www.tobiasschuerg.de'
defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = false
title = 'tobiasschuerg.de'

# Dates the legal pages from the last commit that touched them, via the
# default `lastmod = [':git', ...]` chain. Needs full git history, so the
# deploy workflow checks out with fetch-depth: 0.
enableGitInfo = true

# Renders layouts/robots.txt, which points crawlers at the sitemap.
enableRobotsTXT = true

# Disable unused features
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  github_username = "tobiasschuerg"
  display_name = "Tobias Schürg"
  contact_email = "kontakt@molemail.eu"

[languages]
  [languages.de]
    locale = 'de-DE'
    label = 'Deutsch'
    title = 'tobiasschuerg.de'
    weight = 1
    [languages.de.params]
      description = "Sammelt digitalen Staub."
    [[languages.de.menu.main]]
      identifier = "projects"
      name = "Projekte"
      url = "/"
      weight = 10
    [[languages.de.menu.main]]
      identifier = "pizzeria"
      name = "Pizzeria"
      url = "/pizzeria/"
      weight = 20
    [[languages.de.menu.main]]
      identifier = "about"
      name = "Über"
      url = "/about/"
      weight = 30

  # English is prepared but not published yet. To enable it:
  #  1. remove 'disabled' below
  #  2. add English translations: content/<name>.en.md for each page,
  #     incl. content/projects/*.en.md (the cards read .Site.RegularPages,
  #     which is per-language, so untranslated projects show an empty grid)
  #  3. add a language switcher to layouts/_default/baseof.html and change
  #     the menu/card URLs to be language-aware (relLangURL)
  #  4. translate layouts/pizzeria.html — the game's UI strings and
  #     assets/js/pizza.js are German only, the .en.md is just the stub
  [languages.en]
    disabled = true
    locale = 'en-US'
    label = 'English'
    title = 'tobiasschuerg.de'
    weight = 2
    [languages.en.params]
      description = "Collecting digital dust."
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      url = "/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "pizzeria"
      name = "Pizzeria"
      url = "/pizzeria/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 30
