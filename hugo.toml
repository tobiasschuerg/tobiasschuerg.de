baseURL = 'https://www.tobiasschuerg.de'
defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = false
title = 'tobiasschuerg.de'

# Disable unused features
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  github_username = "tobiasschuerg"
  display_name = "Tobias Schürg"

[languages]
  [languages.de]
    languageCode = 'de-DE'
    languageName = 'Deutsch'
    title = 'tobiasschuerg.de'
    weight = 1
    [languages.de.params]
      description = "Sammelt digitalen Staub."
    [[languages.de.menu.main]]
      identifier = "projects"
      name = "Projekte"
      url = "/"
      weight = 10
    [[languages.de.menu.main]]
      identifier = "about"
      name = "Über"
      url = "/about/"
      weight = 20

  # English is prepared but not published yet. To enable it:
  #  1. remove 'disabled' below
  #  2. add English translations: content/<name>.en.md for each page,
  #     incl. content/projects/*.en.md (the cards read .Site.RegularPages,
  #     which is per-language, so untranslated projects show an empty grid)
  #  3. add a language switcher to layouts/_default/baseof.html and change
  #     the menu/card URLs to be language-aware (relLangURL)
  [languages.en]
    disabled = true
    languageCode = 'en-US'
    languageName = 'English'
    title = 'tobiasschuerg.de'
    weight = 2
    [languages.en.params]
      description = "Collecting digital dust."
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      url = "/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 20
